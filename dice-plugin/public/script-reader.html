<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剧本阅读 · 鲸屿</title><link rel="stylesheet" href="/script-reader.css"></head><body><main class="reader-shell"><header><div><p class="eyebrow">AIRUNNING / SCRIPT READER</p><h1>读完这一场相遇。</h1><p class="muted">进行中与已归档剧本 · 完整记录分页阅读 · 显示筛选不改动原文</p></div><a href="/dice-lab.html#script-log">返回骰子工作台 ↗</a></header><section class="reader-source"><div><label for="reader-group">群聊</label><select id="reader-group"></select></div><div class="script-choice"><label for="reader-session">选择剧本</label><select id="reader-session"></select></div><button id="reader-refresh">刷新记录</button><a id="reader-download" class="button" hidden>下载完整原文</a></section><p id="reader-status" role="status" aria-live="polite">正在读取剧本目录…</p><div class="reader-layout"><aside><details open><summary>阅读筛选</summary><p class="muted">仅在本标签页记住选择。原始剧本和NPC记忆均不会改变。</p><label class="check"><input type="checkbox" id="reader-hide-ooc">隐藏 ** 场外注释</label><label class="check"><input type="checkbox" id="reader-hide-kp">隐藏 KP 发言</label><label for="reader-kp">本页KP身份</label><select id="reader-kp"><option value="">按记录身份自动识别</option></select><p class="muted">旧剧本未记KP时可临时指定，不修改真实KP设置。</p><label for="reader-search">全文查找</label><input id="reader-search" type="search" maxlength="200" placeholder="在全部记录中查找角色或内容"><div class="actor-heading"><h2>显示哪些角色</h2><button id="reader-reset" class="subtle">恢复全部</button></div><div id="reader-speakers" class="reader-speakers"></div><p id="reader-filter-note" class="muted"></p></details><p class="muted">下载包含所有原文，也包含当前隐藏的发言和注释。</p><label class="check muted"><input type="checkbox" id="reader-live">每10秒刷新当前页</label></aside><section class="reader-content" aria-label="剧本正文"><div class="reader-caption"><div><h2 id="reader-title">选择一份剧本</h2><p class="muted" id="reader-count"></p></div><label for="reader-size">每页 <select id="reader-size"><option value="50">50条</option><option value="100" selected>100条</option><option value="200">200条</option></select></label></div><p id="reader-warning" class="reader-warning" hidden></p><div id="reader-entries"></div><nav class="reader-pagination" aria-label="剧本分页"><button id="reader-prev" disabled>上一页</button><span id="reader-page"></span><button id="reader-next" disabled>下一页</button></nav></section></div></main><script type="module" src="/script-reader.js"></script></body></html>
